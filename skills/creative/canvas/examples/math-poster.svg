<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 1200" width="1100" height="1200"><rect x="0" y="0" width="1100" height="1200" fill="#ffffff" /><g><g><rect x="0" y="0" width="1100" height="1200" fill="#fbf8f0" /></g><g><rect x="0" y="0" width="1100" height="110" fill="#1a2a4a" /><rect x="0" y="102" width="1100" height="8" fill="#c89b3c" /><text x="40" y="50" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="32" font-weight="700" fill="#fbf8f0">Binary Search</text><text x="40" y="78" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="16" font-style="italic" fill="#d6dbe3">A logarithmic-time decision procedure for ordered arrays</text><text x="1060" y="50" text-anchor="end" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" fill="#c89b3c" letter-spacing="0.12em">HERMES CANVAS · ALGORITHMS 101</text><text x="1060" y="72" text-anchor="end" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" font-style="italic" fill="#d6dbe3">poster series · vol. 1</text></g><g transform="translate(40, 130)"><rect x="0" y="0" width="1020" height="64" fill="#ffffff" stroke="#d8d2c2" /><rect x="0" y="0" width="4" height="64" fill="#7d2d3a" /><text x="20" y="20" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" letter-spacing="0.2em" font-weight="700" fill="#7d2d3a">ABSTRACT</text><text x="20" y="40" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" fill="#1a2a4a">We re-derive the worst-case running time of binary search by reducing each iteration to a halving of the</text><text x="20" y="56" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" fill="#1a2a4a">candidate window, yielding the recurrence T(n) = T(n/2) + Θ(1) and the closed form Θ(log n).</text></g><g transform="translate(40, 220)"><line x1="0" y1="0" x2="490" y2="0" stroke="#1a2a4a" stroke-width="2" /><text x="0" y="22" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" letter-spacing="0.2em" font-weight="700" fill="#7d2d3a">PROBLEM</text><g transform="translate(0, 38)"><g><text x="0" y="0" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" font-style="normal" fill="#1a2a4a">Given a sorted array A[0..n−1] of comparable</text><text x="0" y="18" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" font-style="normal" fill="#1a2a4a">elements and a target t, decide whether t ∈ A,</text><text x="0" y="36" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" font-style="normal" fill="#1a2a4a">and if so return any index i with A[i] = t.</text></g></g></g><g transform="translate(40, 350)"><line x1="0" y1="0" x2="490" y2="0" stroke="#1a2a4a" stroke-width="2" /><text x="0" y="22" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" letter-spacing="0.2em" font-weight="700" fill="#7d2d3a">LOOP INVARIANT</text><g transform="translate(0, 38)"><g><text x="0" y="0" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" font-style="italic" fill="#1a2a4a">If t ∈ A, then t ∈ A[lo..hi] at every iteration</text><text x="0" y="18" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" font-style="italic" fill="#1a2a4a">of the while-loop.</text></g><g transform="translate(0, 50)"><g><rect x="0" y="0" width="460" height="38" fill="#ffffff" stroke="#d8d2c2" /><text x="230" y="24" text-anchor="middle" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="16" font-style="italic" fill="#1a2a4a">lo ≤ hi   ∧   t ∈ A  ⟹  t ∈ A[lo..hi]</text></g></g></g></g><g transform="translate(40, 510)"><line x1="0" y1="0" x2="490" y2="0" stroke="#1a2a4a" stroke-width="2" /><text x="0" y="22" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" letter-spacing="0.2em" font-weight="700" fill="#7d2d3a">FIGURE: WINDOW HALVING</text><g transform="translate(0, 38)"><g><g transform="translate(0, 0)"><rect x="0" y="0" width="460" height="26" fill="#f3eee0" stroke="#d8d2c2" /><rect x="0" y="0" width="460" height="26" fill="#1a2a4a" /><text x="230" y="17" text-anchor="middle" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-style="italic" font-size="12" fill="#fff">n</text><text x="470" y="17" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" fill="#5b5e6b">iter 1</text></g><g transform="translate(0, 36)"><rect x="0" y="0" width="460" height="26" fill="#f3eee0" stroke="#d8d2c2" /><rect x="0" y="0" width="230" height="26" fill="#3a527c" /><text x="115" y="17" text-anchor="middle" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-style="italic" font-size="12" fill="#fff">n/2</text><text x="470" y="17" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" fill="#5b5e6b">iter 2</text></g><g transform="translate(0, 72)"><rect x="0" y="0" width="460" height="26" fill="#f3eee0" stroke="#d8d2c2" /><rect x="0" y="0" width="115" height="26" fill="#7088b0" /><text x="57.5" y="17" text-anchor="middle" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-style="italic" font-size="12" fill="#fff">n/4</text><text x="470" y="17" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" fill="#5b5e6b">iter 3</text></g><g transform="translate(0, 108)"><rect x="0" y="0" width="460" height="26" fill="#f3eee0" stroke="#d8d2c2" /><rect x="0" y="0" width="57.5" height="26" fill="#c89b3c" /><text x="28.75" y="17" text-anchor="middle" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-style="italic" font-size="12" fill="#fff">n/8</text><text x="470" y="17" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" fill="#5b5e6b">iter 4</text></g></g><text x="0" y="160" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-style="italic" font-size="11" fill="#5b5e6b">Each iteration discards half of the candidate window.</text></g></g><g transform="translate(570, 220)"><line x1="0" y1="0" x2="490" y2="0" stroke="#1a2a4a" stroke-width="2" /><text x="0" y="22" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" letter-spacing="0.2em" font-weight="700" fill="#7d2d3a">ALGORITHM</text><g transform="translate(0, 38)"><g><rect x="0" y="0" width="490" height="164" fill="#f3eee0" stroke="#d8d2c2" /><text x="14" y="20" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#102a43">function bsearch(A, t):</text><text x="14" y="38" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#102a43">    lo, hi ← 0, n − 1</text><text x="14" y="56" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#102a43">    while lo ≤ hi:</text><text x="14" y="74" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#102a43">        mid ← ⌊(lo + hi) / 2⌋</text><text x="14" y="92" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#102a43">        if   A[mid] = t : return mid</text><text x="14" y="110" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#102a43">        elif A[mid] &lt; t : lo ← mid + 1</text><text x="14" y="128" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#102a43">        else           : hi ← mid − 1</text><text x="14" y="146" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#102a43">    return −1</text></g></g></g><g transform="translate(570, 450)"><line x1="0" y1="0" x2="490" y2="0" stroke="#1a2a4a" stroke-width="2" /><text x="0" y="22" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" letter-spacing="0.2em" font-weight="700" fill="#7d2d3a">RECURRENCE &amp; CLOSED FORM</text><g transform="translate(0, 38)"><g><rect x="0" y="0" width="460" height="38" fill="#ffffff" stroke="#d8d2c2" /><text x="230" y="24" text-anchor="middle" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="16" font-style="italic" fill="#1a2a4a">T(n) = T(n/2) + Θ(1)</text></g><g transform="translate(0, 56)"><g><rect x="0" y="0" width="460" height="60" fill="#ffffff" stroke="#d8d2c2" /><text x="230" y="38" text-anchor="middle" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="22" font-style="italic" fill="#1a2a4a">T(n) = Θ(log₂ n)</text></g></g><g transform="translate(0, 134)"><g><text x="0" y="0" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" font-style="normal" fill="#1a2a4a">By the Master Theorem with a = 1, b = 2,</text><text x="0" y="18" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" font-style="normal" fill="#1a2a4a">f(n) = Θ(1), case 2 applies with k = 0, so</text><text x="0" y="36" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" font-style="normal" fill="#1a2a4a">T(n) ∈ Θ(log n).</text></g></g></g></g><g transform="translate(40, 790)"><line x1="0" y1="0" x2="1020" y2="0" stroke="#1a2a4a" stroke-width="2" /><text x="0" y="22" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" letter-spacing="0.2em" font-weight="700" fill="#7d2d3a">EMPIRICAL STEP COUNTS</text><g transform="translate(0, 38)"><g><rect x="0" y="0" width="620" height="132" fill="#fff" stroke="#1a2a4a" stroke-width="1.5" /><rect x="0" y="0" width="620" height="28" fill="#1a2a4a" /><text x="12" y="18" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" font-weight="700" fill="#fbf8f0">n</text><text x="92" y="18" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" font-weight="700" fill="#fbf8f0">linear (steps)</text><text x="292" y="18" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" font-weight="700" fill="#fbf8f0">binary (steps)</text><text x="492" y="18" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" font-weight="700" fill="#fbf8f0">speedup</text><g><text x="12" y="45" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" fill="#1a2a4a" font-style="italic">10³</text><text x="92" y="45" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#1a2a4a" font-style="normal">10³</text><text x="292" y="45" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#1a2a4a" font-style="normal">≈ 10</text><text x="492" y="45" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" fill="#1a2a4a" font-style="normal">×100</text></g><g><rect x="0" y="54" width="620" height="26" fill="#f3eee0" /><text x="12" y="71" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" fill="#1a2a4a" font-style="italic">10⁶</text><text x="92" y="71" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#1a2a4a" font-style="normal">10⁶</text><text x="292" y="71" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#1a2a4a" font-style="normal">≈ 20</text><text x="492" y="71" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" fill="#1a2a4a" font-style="normal">×50,000</text></g><g><text x="12" y="97" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" fill="#1a2a4a" font-style="italic">10⁹</text><text x="92" y="97" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#1a2a4a" font-style="normal">10⁹</text><text x="292" y="97" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#1a2a4a" font-style="normal">≈ 30</text><text x="492" y="97" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" fill="#1a2a4a" font-style="normal">×33M</text></g><g><rect x="0" y="106" width="620" height="26" fill="#f3eee0" /><text x="12" y="123" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" fill="#1a2a4a" font-style="italic">10¹²</text><text x="92" y="123" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#1a2a4a" font-style="normal">10¹²</text><text x="292" y="123" font-family="SFMono-Regular, Menlo, &apos;Courier New&apos;, monospace" font-size="12" fill="#1a2a4a" font-style="normal">≈ 40</text><text x="492" y="123" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" fill="#1a2a4a" font-style="normal">×25B</text></g><line x1="80" y1="28" x2="80" y2="132" stroke="#d8d2c2" /><line x1="280" y1="28" x2="280" y2="132" stroke="#d8d2c2" /><line x1="480" y1="28" x2="480" y2="132" stroke="#d8d2c2" /></g></g></g><g transform="translate(680, 980)"><g><rect x="0" y="0" width="380" height="128" fill="#fff" stroke="#7d2d3a" stroke-width="1.5" /><rect x="0" y="0" width="4" height="128" fill="#7d2d3a" /><text x="16" y="26" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" letter-spacing="0.2em" font-weight="700" fill="#7d2d3a">KEY TAKEAWAYS</text><g transform="translate(16, 44)"><circle cx="5" cy="6" r="3" fill="#c89b3c" /><text x="16" y="10" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" fill="#1a2a4a">Halving ⟹ ⌈log₂ n⌉ iterations worst-case.</text></g><g transform="translate(16, 66)"><circle cx="5" cy="6" r="3" fill="#c89b3c" /><text x="16" y="10" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" fill="#1a2a4a">Sortedness is essential — unsorted ⟹ Θ(n).</text></g><g transform="translate(16, 88)"><circle cx="5" cy="6" r="3" fill="#c89b3c" /><text x="16" y="10" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" fill="#1a2a4a">Stable variant: linear scan after first hit.</text></g><g transform="translate(16, 110)"><circle cx="5" cy="6" r="3" fill="#c89b3c" /><text x="16" y="10" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="13" fill="#1a2a4a">Off-by-one bugs cluster at lo, hi, mid updates.</text></g></g></g><g transform="translate(0, 1140)"><g><rect x="0" y="0" width="1100" height="50" fill="#1a2a4a" /><text x="40" y="20" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" letter-spacing="0.2em" font-weight="700" fill="#c89b3c">REFERENCES</text><text x="40" y="40" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" fill="#fbf8f0" font-style="italic">[1] Knuth, TAOCP Vol. 3 §6.2.1</text><text x="380" y="40" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" fill="#fbf8f0" font-style="italic">[2] CLRS 4th ed., Ch. 2</text><text x="720" y="40" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" fill="#fbf8f0" font-style="italic">[3] Bentley, Programming Pearls Ch. 4</text></g></g></g></svg>