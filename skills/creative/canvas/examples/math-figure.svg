&apos;, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">hidden 2</text><text x="0" y="18" text-anchor="middle" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" font-style="italic" fill="#6a6f78">h₂ = ReLU(W₂h₁)</text><text x="0" y="34" text-anchor="middle" font-family="&apos;Helvetica Neue&apos;, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="10" fill="#6a6f78">d = 6</text></g><g transform="translate(660, 348)"><text x="0" y="0" text-anchor="middle" font-family="&apos;Helvetica Neue&apos;, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="12" font-weight="700" fill="#1a4f9c">output</text><text x="0" y="18" text-anchor="middle" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" font-style="italic" fill="#6a6f78">ŷ = softmax(W₃h₂)</text><text x="0" y="34" text-anchor="middle" font-family="&apos;Helvetica Neue&apos;, Arial, &apos;Liberation Sans&apos;, sans-serif" font-size="10" fill="#6a6f78">d = 3</text></g></g><g transform="translate(60, 390)"><line x1="0" y1="-14" x2="600" y2="-14" stroke="#bfc3c9" stroke-width="0.8" /><text x="0" y="6" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" font-weight="700" fill="#1a1a1a">Figure 1.</text><text x="56" y="6" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="12" font-style="italic" fill="#1a1a1a">Multilayer perceptron with two hidden layers.</text><text x="0" y="26" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" fill="#333333">Fully-connected feed-forward network with ReLU activations on the hidden layers and a softmax</text><text x="0" y="41" font-family="Georgia, &apos;Times New Roman&apos;, &apos;Liberation Serif&apos;, serif" font-size="11" fill="#333333">head over three classes. Edges depict the weight matrices W₁ ∈ ℝ⁶ˣ⁴, W₂ 