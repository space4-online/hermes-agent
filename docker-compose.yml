#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The entrypoint remaps the internal `hermes` user to these values via
# usermod/groupmod + gosu.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep /opt/hermes/docker/entrypoint.sh in
#     the command chain. It drops root to the hermes user before gateway
#     files such as gateway.lock are created.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  mysql:
    image: ${MYSQL_IMAGE:-crpi-vz0a3h0d9w77e3sp.cn-shanghai.personal.cr.aliyuncs.com/my_workflow/mysql:8.0}
    container_name: hermes-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=200
    env_file:
      - /home/server/env/hermes.env
    ports:
      # 仅绑 127.0.0.1，公网不可达；gateway 走 host 网络访问 127.0.0.1:3306
      - "127.0.0.1:3306:3306"
    volumes:
      - /data/hermes-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    build:
      context: .
      # 本机持续构建场景：依靠 BuildKit builder cache + Dockerfile 里的
      # --mount=type=cache,target=/root/.cache/uv 即可跨构建复用；不需要
      # cache_from。之前加的 cache_from: hermes-agent:latest 会被 BuildKit
      # 误当作 remote registry image 去拉（走 daemon 配的 daocloud 镜像加速器），
      # 导致 403 Forbidden，反而让 build 在第一步就报错。
      args:
        # 把缓存元数据写进镜像本身（必须配合 DOCKER_BUILDKIT=1）；
        # 跨主机构建时可作为 cache_from 源，本机构建不影响。
        BUILDKIT_INLINE_CACHE: "1"
        # 构建期国内加速（如 GH Runner 上构建可设为空）
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        # 基础镜像指向阿里云 ACR 同步份（docker-image-sync 规则：源路径中的 / 转换为 -）
        UV_IMAGE: ${UV_IMAGE:-crpi-vz0a3h0d9w77e3sp.cn-shanghai.personal.cr.aliyuncs.com/my_workflow/ghcr.io-astral-sh-uv:0.11.6-python3.13-trixie}
        GOSU_IMAGE: ${GOSU_IMAGE:-crpi-vz0a3h0d9w77e3sp.cn-shanghai.personal.cr.aliyuncs.com/my_workflow/tianon-gosu:1.19-trixie}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:-crpi-vz0a3h0d9w77e3sp.cn-shanghai.personal.cr.aliyuncs.com/my_workflow/debian:13.4}
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      # 提供 MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE 以供下方变量展开
      - /home/server/env/hermes.env
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # ----- MySQL 后端（hermes_db 切换为 mysql）-----
      - HERMES_DB_BACKEND=mysql
      - HERMES_DB_HOST=127.0.0.1
      - HERMES_DB_PORT=3306
      - HERMES_DB_NAME=${MYSQL_DATABASE:-hermes}
      - HERMES_DB_USER=${MYSQL_USER:-hermes}
      - HERMES_DB_PASSWORD=${MYSQL_PASSWORD}
      # ----- Hermes 主模型（从 env_file 注入 DEEPSEEK_API_KEY/DEEPSEEK_BASE_URL） -----
      # HERMES_MODEL 控制默认推理模型；gateway 上下文会读取该环境变量。
      # 当前默认走阿里百炼 DashScope 上的 deepseek-v3.1：
      #   - DeepSeek 官方 API 在部分出口 IP 会 403 "region"受限
      #   - OpenRouter 账号可能未充值（402 Insufficient credits）
      #   - 阿里百炼 deepseek-v3.1 在国内出口 IP 可直接调用
      # 本机 key 是国内版，需重写 DASHSCOPE_BASE_URL 为国内端点。
      # 若后续账号 region 能直连 DeepSeek，可在 hermes.env 设置：
      #   HERMES_INFERENCE_PROVIDER=deepseek
      #   HERMES_MODEL=deepseek-v4-pro
      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-alibaba}
      - HERMES_MODEL=${HERMES_MODEL:-deepseek-v3.1}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # ----- OpenAI 兼容 API server -----
      # API_SERVER_HOST/PORT/KEY 不在这里注入：hermes_cli 启动时会 load_hermes_dotenv
      # 加载 ~/.hermes/.env（容器内 /opt/data/.env）且 override=True。在 docker-compose 里再
      # 注入会造成“空值覆盖强随机 key”的竞争。运维在 ~/.hermes/.env 维护即可：
      #   API_SERVER_HOST=0.0.0.0
      #   API_SERVER_PORT=8642
      #   API_SERVER_KEY=<random-64-hex>
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
      # ----- 图像生成（百炼万相）-----
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      # ----- 视觉理解（百炼通义千问 VL）-----
      - AUXILIARY_VISION_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - AUXILIARY_VISION_API_KEY=${DASHSCOPE_API_KEY}
      - AUXILIARY_VISION_MODEL=qwen-vl-max
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    # Localhost-only. For remote access, tunnel via `ssh -L 9119:localhost:9119`.
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
