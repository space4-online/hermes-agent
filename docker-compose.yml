#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   docker compose up -d
#
# HERMES_UID/GID are auto-detected from the mounted ~/.hermes directory owner;
# explicit env vars are no longer required.  The entrypoint uses `stat` to
# read the volume's actual UID/GID and remaps the container's hermes user
# accordingly (mirrors the workflow service UID-alignment pattern).
#
# Key configuration sources (in priority order, highest wins):
#   1. /opt/data/.env  (= ~/.hermes/.env on host)  — load_hermes_dotenv override=True
#   2. docker-compose environment section           — set at container start
#   3. /home/server/env/hermes.env via env_file     — lowest; overridden by above
#
# The env_file sets variables first; the environment section may override them.
# Use passthrough syntax ("- VAR", no "=") to avoid docker-compose expanding
# ${VAR} from the host shell and accidentally producing empty overrides.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep /opt/hermes/docker/entrypoint.sh in
#     the command chain. It drops root to the hermes user before gateway
#     files such as gateway.lock are created.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  mysql:
    image: ${MYSQL_IMAGE:-crpi-vz0a3h0d9w77e3sp.cn-shanghai.personal.cr.aliyuncs.com/my_workflow/mysql:8.0}
    container_name: hermes-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=200
    env_file:
      - /home/server/env/hermes.env
    ports:
      # 仅绑 127.0.0.1，公网不可达；gateway 走 host 网络访问 127.0.0.1:3306
      - "127.0.0.1:3306:3306"
    volumes:
      - /data/hermes-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    build:
      context: .
      # 本机持续构建场景：依靠 BuildKit builder cache + Dockerfile 里的
      # --mount=type=cache,target=/root/.cache/uv 即可跨构建复用；不需要
      # cache_from。之前加的 cache_from: hermes-agent:latest 会被 BuildKit
      # 误当作 remote registry image 去拉（走 daemon 配的 daocloud 镜像加速器），
      # 导致 403 Forbidden，反而让 build 在第一步就报错。
      args:
        # 把缓存元数据写进镜像本身（必须配合 DOCKER_BUILDKIT=1）；
        # 跨主机构建时可作为 cache_from 源，本机构建不影响。
        BUILDKIT_INLINE_CACHE: "1"
        # 构建期国内加速（如 GH Runner 上构建可设为空）
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        # 基础镜像指向阿里云 ACR 同步份（docker-image-sync 规则：源路径中的 / 转换为 -）
        UV_IMAGE: ${UV_IMAGE:-crpi-vz0a3h0d9w77e3sp.cn-shanghai.personal.cr.aliyuncs.com/my_workflow/ghcr.io-astral-sh-uv:0.11.6-python3.13-trixie}
        GOSU_IMAGE: ${GOSU_IMAGE:-crpi-vz0a3h0d9w77e3sp.cn-shanghai.personal.cr.aliyuncs.com/my_workflow/tianon-gosu:1.19-trixie}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE:-crpi-vz0a3h0d9w77e3sp.cn-shanghai.personal.cr.aliyuncs.com/my_workflow/debian:13.4}
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    # gateway drain（restart_drain_timeout 默认 180s）需要 docker stop 留足时间：
    # 默认 10s 宽限会在 drain 完成前 SIGKILL，导致 resume_pending 标记与
    # 会话关闭通知来不及发出，重启后无法自动恢复被打断的任务。
    stop_grace_period: 200s
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      # 提供 MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE 以供下方变量展开
      - /home/server/env/hermes.env
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-}
      - HERMES_GID=${HERMES_GID:-}
      # ----- 数据库后端 -----
      # 暂不设 HERMES_DB_BACKEND=mysql：hermes_state.SessionDB 尚未完成 MySQL 迁移
      # (见 hermes_state.py 中的 RuntimeError gate)，开启后会导致会话完全无法写入，
      # dashboard 也读不到任何 session。暂时以 SQLite 为主：
      #   state.db / kanban.db / memory_store.db / response_store.db
      # 均落在 ~/.hermes（host volume），gateway 与 dashboard 共享。
      # 等 SessionDB 完成 MySQL 适配后再统一切换。
      # ----- Hermes 主模型（从 env_file 注入 DEEPSEEK_API_KEY/DEEPSEEK_BASE_URL） -----
      # HERMES_MODEL 控制默认推理模型；gateway 上下文会读取该环境变量。
      # 默认走 DeepSeek 官方 API（agent-h 出口 IP 不受 region 限制，验证通过）。
      # 兜底链路：阿里百炼 DashScope（deepseek-v3.1 / qwen 系列），不再使用 OpenRouter。
      # 主模型异常时切换：HERMES_INFERENCE_PROVIDER=alibaba HERMES_MODEL=deepseek-v3.1
      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-deepseek}
      - HERMES_MODEL=${HERMES_MODEL:-deepseek-v4-pro}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # ----- OpenAI 兼容 API server -----
      # API_SERVER_HOST/PORT/KEY 不在这里注入：hermes_cli 启动时会 load_hermes_dotenv
      # 加载 ~/.hermes/.env（容器内 /opt/data/.env）且 override=True。在 docker-compose 里再
      # 注入会造成“空值覆盖强随机 key”的竞争。运维在 ~/.hermes/.env 维护即可：
      #   API_SERVER_HOST=0.0.0.0
      #   API_SERVER_PORT=8642
      #   API_SERVER_KEY=<random-64-hex>
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
      # ----- 图像生成（百炼万相）-----
      # 注意：不用 ${DASHSCOPE_API_KEY} 展开！docker-compose 从 host shell 展开，
      # 若 shell 未 export 该变量则展开为空字符串并覆盖 env_file 中的有效值。
      # 使用纯透传语法（无 =），仅当 host shell 已 export 时才设置；否则 env_file 值保留。
      # AUXILIARY_*_API_KEY 的派生逻辑移至 entrypoint.sh（见 docker/entrypoint.sh）。
      - DASHSCOPE_API_KEY
      # ----- 视觉理解（百炼通义千问 VL）-----
      - AUXILIARY_VISION_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - AUXILIARY_VISION_MODEL=qwen-vl-max
      # ----- 网页抽取/摘要（百炼 qwen-plus，不再走 OpenRouter）-----
      - AUXILIARY_WEB_EXTRACT_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - AUXILIARY_WEB_EXTRACT_MODEL=qwen-plus
      # 注：session_search / compression 等没有 env 桥接的 auxiliary 任务，
      # 通过 ~/.hermes/config.yaml 的 auxiliary 段强制走 alibaba（见 cli-config.yaml.example）。
      # 同时运维需在 hermes.env 中【不要设置 OPENROUTER_API_KEY】，
      # 否则 auxiliary auto 会优先走 OpenRouter。
      # ----- 容器运行时标记（供 agent 提示词感知部署环境）-----
      - HERMES_CONTAINER=docker
    command: ["gateway", "run"]
    ulimits:
      nofile:
        soft: 65536
        hard: 524288

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    env_file:
      - /home/server/env/hermes.env
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-}
      - HERMES_GID=${HERMES_GID:-}
      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-deepseek}
      - HERMES_MODEL=${HERMES_MODEL:-deepseek-v4-pro}
      # 容器运行时标记（与 gateway 一致，供 _is_container() 检测使用）
      - HERMES_CONTAINER=docker
    # --tui 启用嵌入式 Chat 页面（内嵌 hermes TUI via PTY/WebSocket）
    command: ["dashboard", "--host", "0.0.0.0", "--insecure", "--no-open", "--tui"]

  # HTTPS 反代 + SSE 代理。使用官方 nginx:alpine，配置模板在启动时自动 envsubst 展开。
  # certbot 保留在宿主机通过 webroot 模式续期，证书目录 /etc/letsencrypt 挂载进容器（只读）。
  nginx:
    image: nginx:alpine
    container_name: hermes-nginx
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/docker-entrypoint.d/00-remove-default.sh:/docker-entrypoint.d/00-remove-default.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    environment:
      - HERMES_DOMAIN=${HERMES_DOMAIN:-agent-h.codeshark.cn}
      - HERMES_PORT=${HERMES_PORT:-8642}
    # 使用 nginx 原生命令以触发官方 entrypoint 的模板处理逻辑
    command: ["nginx", "-g", "daemon off;"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
